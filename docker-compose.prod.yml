services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - internal

  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        INSTALL_OCR: ${INSTALL_OCR:-false}
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_STUDENT_ID: ${ADMIN_STUDENT_ID}
      ADMIN_DEPARTMENT: ${ADMIN_DEPARTMENT}
      AUTO_CREATE_DB: ${AUTO_CREATE_DB:-true}
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      PADDLE_RUNTIME_HOME: /app/instance/paddle_runtime
      AI_PARSER_ENABLED: ${AI_PARSER_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-60}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-4096}
      AI_PARSER_MAX_ITEMS: ${AI_PARSER_MAX_ITEMS:-400}
      VISION_PARSER_ENABLED: ${VISION_PARSER_ENABLED:-false}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_MODEL: ${VISION_MODEL:-qwen-vl-max}
      VISION_TIMEOUT: ${VISION_TIMEOUT:-120}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-4096}
      VISION_MAX_IMAGE_WIDTH: ${VISION_MAX_IMAGE_WIDTH:-2000}
      MAX_CONTENT_LENGTH_MB: ${MAX_CONTENT_LENGTH_MB:-10}
      CSRF_ENABLED: ${CSRF_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/instance/uploads
      - materials_data:/app/instance/materials
      - paddle_runtime:/app/instance/paddle_runtime
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  mysql_data:
  uploads_data:
  materials_data:
  paddle_runtime:
  caddy_data:
  caddy_config:
